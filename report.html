<title>안전보건 현장진단 결과보고서</title>
<!-- ?v= 뒤 숫자는 캐시 무효화 표시. 파일을 수정해 올릴 때 1씩 올린다. -->
<!-- 고유 파일명으로 캐시를 완전히 우회한다. 새 파일 로드가 실패하면 기존 파일로 한 번 더 시도한다. -->
<link rel="stylesheet" href="report-v12.css" onerror="this.onerror=null;this.href='report.css?v=12'">
</head>
<body>
<!-- 상단 페이지 이동 버튼과 각 장은 report.js가 실제 데이터에 맞춰 만든다.
     (사고이력이 없으면 사고조사 장이 아예 생기지 않고, 미흡사항이 많으면 장이 자동으로 늘어난다) -->
<div id="deck" class="sr-report"></div>
<script src="report.js?v=12"></script>
</body>
</html>
